<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狸柚 (Riyu) - Official Portfolio</title>
    <!-- Tailwind CSS & FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            transition: background-color 0.3s, color 0.3s;
        }
        .glass-panel {
            backdrop-filter: blur(12px);
        }
        .glass-card {
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen pb-16 bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100 light:bg-slate-50 light:text-slate-900 selection:bg-sky-500 selection:text-white">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-800/80 bg-slate-900/80 dark:bg-slate-900/80 dark:border-slate-800/80 px-6 py-3.5">
        <div class="max-w-6xl mx-auto flex justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-500 p-0.5 shadow-md">
                    <img src="https://picsum.photos/100" alt="Avatar" class="w-full h-full rounded-full object-cover">
                </div>
                <span class="text-base font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-indigo-300">狸柚 (Riyu)</span>
            </div>

            <!-- 控制面板：主題與語言切換 -->
            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-800/80 border border-slate-700/60 text-amber-400 hover:text-amber-300 transition text-xs flex items-center gap-1.5 px-3">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                    <span id="theme-text" class="hidden sm:inline font-medium">Dark</span>
                </button>
                <div class="flex items-center gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800 text-xs font-medium">
                    <button onclick="setLanguage('ja')" id="lang-ja" class="px-3 py-1.5 rounded-lg bg-sky-500 text-white shadow-sm transition">日本語</button>
                    <button onclick="setLanguage('zh')" id="lang-zh" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition">中文</button>
                    <button onclick="setLanguage('en')" id="lang-en" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition">EN</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 個人簡介區塊 -->
    <section class="relative">
        <div class="h-48 md:h-64 w-full bg-slate-900 overflow-hidden relative">
            <img src="https://picsum.photos/1200/400" class="w-full h-full object-cover opacity-40 blur-[2px]">
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-slate-950/60 to-slate-950"></div>
        </div>

        <div class="max-w-4xl mx-auto px-4 -mt-20 relative z-10 text-center">
            <div class="inline-block p-1 bg-slate-900 rounded-full shadow-2xl mb-3 border border-slate-700/50">
                <img src="https://picsum.photos/200" alt="NekoAsuka" class="w-24 h-24 md:w-28 md:h-28 rounded-full object-cover">
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">刺客貓貓🎶 <span class="text-sm font-normal text-sky-400 ml-1">@Liyou_maga</span></h1>
            <p class="text-xs text-slate-400 mt-1 font-mono" id="bio-penname">ペンネーム：狸柚 (Riyu)</p>
            
            <p class="mt-3 text-sm text-slate-300 max-w-xl mx-auto leading-relaxed" id="bio-desc">
                青春の光と影、日常の中の小さな奇跡をテーマに、小説を執筆中。<br>願わくは、一言でも誰かの心に届きますように。
            </p>

            <!-- 數據與社群按鈕 -->
            <div class="inline-flex items-center gap-6 mt-6 px-6 py-2.5 rounded-2xl glass-panel bg-slate-900/60 border border-slate-800 text-xs">
                <div class="text-center">
                    <span class="text-slate-400 block text-[10px] uppercase tracking-wider" id="label-following">フォロー中</span>
                    <span class="font-bold text-slate-200 text-sm">86</span>
                </div>
                <div class="w-px h-6 bg-slate-800"></div>
                <div class="text-center">
                    <span class="text-slate-400 block text-[10px] uppercase tracking-wider" id="label-followers">フォロワー</span>
                    <span class="font-bold text-slate-200 text-sm">40</span>
                </div>
                <div class="w-px h-6 bg-slate-800"></div>
                <a href="https://mypage.syosetu.com/3063118/" target="_blank" class="flex items-center gap-1.5 text-sky-400 hover:text-sky-300 font-semibold transition">
                    <i class="fa-solid fa-book text-xs"></i>
                    <span>小説家になろう</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </a>
                <a href="https://x.com/Liyou_maga" target="_blank" class="ml-2 bg-sky-500 hover:bg-sky-400 text-white font-semibold px-3.5 py-1.5 rounded-xl transition shadow-lg shadow-sky-500/20">
                    <i class="fa-brands fa-x-twitter mr-1"></i> <span id="btn-follow">フォロー</span>
                </a>
            </div>
        </div>
    </section>

    <!-- 主要內容區塊 -->
    <main class="max-w-6xl mx-auto mt-12 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- 左側：小說作品區域 (2欄) -->
        <section class="lg:col-span-2 space-y-4">
            
            <!-- 搜尋與動態過濾工具列 -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 border-b border-slate-800/80 pb-4">
                <div class="flex items-center gap-2">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-sky-400"></i>
                        <span id="section-novel-title">作品一覧</span>
                    </h2>
                    <span id="novel-count" class="text-xs font-normal text-slate-400 bg-slate-800/60 px-2.5 py-0.5 rounded-full border border-slate-700/50">5件</span>
                </div>

                <!-- 搜尋框與狀態篩選 -->
                <div class="flex items-center gap-2">
                    <div class="relative flex-1 sm:w-48">
                        <input type="text" id="search-input" oninput="filterNovels()" placeholder="検索..." class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-1.5 pl-8 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
                        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-500 text-xs"></i>
                    </div>
                    <select id="filter-select" onchange="filterNovels()" class="bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-sky-500 transition cursor-pointer">
                        <option value="all">すべて</option>
                        <option value="ongoing">連載中</option>
                        <option value="finished">完結済</option>
                    </select>
                </div>
            </div>

            <!-- 小說卡片容器 -->
            <div class="space-y-3.5" id="novel-list">
                <!-- 由 JavaScript 自動動態渲染卡片 -->
            </div>
        </section>

        <!-- 右側：X (Twitter) 社群動態 (1欄) -->
        <section class="space-y-4">
            <div class="border-b border-slate-800/80 pb-3">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-brands fa-x-twitter text-sky-400"></i>
                    <span id="section-x-title">X 最新ポスト</span>
                </h2>
            </div>
            
            <div class="glass-panel bg-slate-900/50 rounded-2xl p-2 min-h-[550px] border border-slate-800/80" id="x-container">
                <a class="twitter-timeline" 
                   data-height="550" 
                   data-theme="dark" 
                   data-chrome="noheader nofooter transparent shadow"
                   href="https://twitter.com/Liyou_maga?ref_src=twsrc%5Etfw">
                   Posts by @Liyou_maga
                </a> 
            </div>
        </section>

    </main>

    <!-- 小說簡介預覽 Modal 彈窗 -->
    <div id="preview-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="glass-panel bg-slate-900/90 rounded-2xl max-w-lg w-full p-6 space-y-4 border border-slate-700/60 shadow-2xl relative">
            <button onclick="closePreview()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 id="modal-title" class="text-base font-bold text-white border-b border-slate-800 pb-3 pr-6"></h3>
            <p id="modal-body" class="text-slate-300 text-sm leading-relaxed max-h-60 overflow-y-auto pr-2 font-normal"></p>
            <div class="pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
                <button onclick="closePreview()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition font-medium" id="btn-modal-close">閉じる</button>
                <div class="flex gap-2">
                    <button id="btn-modal-inline" onclick="" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-white rounded-xl transition font-semibold shadow-md shadow-emerald-500/20">站內閱讀</button>
                    <a id="btn-modal-go" href="" target="_blank" class="px-4 py-2 bg-sky-500 hover:bg-sky-400 text-white rounded-xl transition font-semibold shadow-md shadow-sky-500/20">新分頁開啟 →</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 全螢幕站內閱讀器 Modal -->
    <div id="reader-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-lg hidden flex flex-col z-50">
        <div class="glass-panel bg-slate-900/90 px-6 py-3 border-b border-slate-800 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-0.5 rounded font-mono">Syosetu Reader</span>
                <h3 id="reader-title" class="text-sm font-bold text-slate-200 truncate max-w-md">小說閱讀</h3>
            </div>
            <div class="flex items-center gap-2">
                <a id="reader-external-btn" href="#" target="_blank" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition text-xs font-medium flex items-center gap-1">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> 原廠視窗
                </a>
                <button onclick="closeReader()" class="px-3 py-1.5 bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 rounded-xl transition text-xs font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-xmark"></i> 關閉閱讀器
                </button>
            </div>
        </div>
        <div class="flex-1 w-full h-full bg-white relative">
            <iframe id="reader-frame" class="w-full h-full border-0" src="" title="Novel Content"></iframe>
        </div>
    </div>

    <!-- JavaScript 功能邏輯 -->
    <script>
        // 精簡後的 5 部核心小說資料庫
        const novels = [
            {
                id: 1,
                title: "隣の氷山先輩に、いつの間にかダメ人間へと飼い慣らされていた件",
                content: "クールで完璧主義と恐れられる『氷山先輩』。しかし、ひょんなことから始まった隣人生活で、彼女の隠された甘やかし本質が全開に……？気付けば俺は、彼女なしでは生きていけないダメ人間になっていて——",
                url: "https://mypage.syosetu.com/3063118/",
                status: "ongoing",
                episodes: "54話",
                date: "2026-08-28",
                category: "現実世界 [恋愛]",
                isRep: true
            },
            {
                id: 2,
                title: "《少女しかない世界で、僕だけが『伝説の存在』だった件》",
                content: "男性が存在しない異世界へと転移してしまった主人公。そこでは『男』という存在自体が神話や伝説の中でしか語られない未知の存在だった。伝説の存在として少女たちに囲まれる波乱の異世界生活が始まる。",
                url: "https://mypage.syosetu.com/3063118/",
                status: "ongoing",
                episodes: "18話",
                date: "2026-08-26",
                category: "異世界 [恋愛]",
                isR15: true,
                isWarning: true
            },
            {
                id: 3,
                title: "更新を一時停止しました「失いたくないから付き合えない」と振られたので、幼馴染の距離感を徹底的にバグらせることにした。～今更後悔しても遅いからな？～",
                content: "「関係を壊したくないから」という理由で振られた主人公。それならと、幼馴染としての距離感を一変させることに。今まで通りの甘えが通じなくなった彼女は、少しずつ自分の本当の気持ちに気付き始める……",
                url: "https://mypage.syosetu.com/3063118/",
                status: "ongoing",
                episodes: "85話",
                date: "2026-08-07",
                category: "現実世界 [恋愛]"
            },
            {
                id: 4,
                title: "幼馴染の越境アラート",
                content: "一線を越えてはいけないはずの幼馴染という関係。しかし、成長とともに変化していく互いの視線と距離感が、二人の間に設定された防衛線を静かに揺るがしていく。",
                url: "https://mypage.syosetu.com/3063118/",
                status: "finished",
                episodes: "27話",
                date: "2026-06-10",
                category: "現実世界 [恋愛]",
                isR15: true
            },
            {
                id: 5,
                title: "私の人形が人間に変わってしまった件について",
                content: "夕日がつくる教室の影。いつも側にいたはずの人形が、ある日突然温もりを持つ『人間』へと姿を変えた。戸惑いと愛おしさが交錯する中で紡がれる、100日間の奇蹟の物語。",
                url: "https://mypage.syosetu.com/3063118/",
                status: "ongoing",
                episodes: "21話",
                date: "2026-05-15",
                category: "現実世界 [恋愛]"
            }
        ];

        let currentLang = 'ja';

        // 渲染小說卡片
        function renderNovels(list) {
            const container = document.getElementById('novel-list');
            document.getElementById('novel-count').innerText = `${list.length}件`;
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">該当する作品が見つかりませんでした。</div>`;
                return;
            }

            list.forEach(item => {
                const card = document.createElement('article');
                card.className = `glass-card bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 relative overflow-hidden ${item.isRep ? 'border-l-4 border-l-amber-400' : ''}`;
                
                const statusBadge = item.status === 'finished' 
                    ? `<span class="text-[11px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-0.5 rounded-full">完結済 (${item.episodes})</span>`
                    : `<span class="text-[11px] bg-sky-500/10 text-sky-400 border border-sky-500/20 px-2.5 py-0.5 rounded-full">連載 (${item.episodes})</span>`;

                const repBadge = item.isRep 
                    ? `<span class="text-[11px] font-bold bg-amber-400/10 text-amber-300 border border-amber-400/30 px-2.5 py-0.5 rounded-full flex items-center gap-1"><i class="fa-solid fa-crown text-[10px]"></i> 代表作</span>`
                    : '';

                const r15Badge = item.isR15 ? `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-1.5 py-0.5 rounded text-[10px]">R15</span>` : '';
                const warningBadge = item.isWarning ? `<span class="text-slate-500 text-[11px]">残酷描写あり</span>` : '';

                card.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <div class="flex items-center gap-2">
                            ${repBadge}
                            ${statusBadge}
                        </div>
                        <time class="text-xs text-slate-500 font-mono">最終更新日：${item.date}</time>
                    </div>
                    
                    <h3 class="text-base font-bold text-slate-100 hover:text-sky-400 cursor-pointer transition leading-snug" onclick="openPreview(${item.id})">
                        ${item.title}
                    </h3>

                    <div class="flex flex-wrap items-center justify-between gap-3 mt-4 pt-3 border-t border-slate-800/60 text-xs">
                        <div class="flex items-center gap-1.5 text-slate-400">
                            <span class="bg-slate-800 px-2 py-0.5 rounded text-[11px]">${item.category}</span>
                            ${r15Badge}
                            ${warningBadge}
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="openPreview(${item.id})" class="text-slate-400 hover:text-sky-400 transition flex items-center gap-1">
                                <i class="fa-regular fa-eye"></i> <span class="btn-prev-text">あらすじ預覽</span>
                            </button>
                            <button onclick="openReader(${item.id})" class="text-emerald-400 hover:text-emerald-300 font-medium transition flex items-center gap-1">
                                <i class="fa-solid fa-book-open"></i> <span class="btn-inline-text">站內閱讀</span>
                            </button>
                            <a href="${item.url}" target="_blank" class="text-sky-400 hover:text-sky-300 font-medium transition flex items-center gap-1">
                                <span class="btn-read-text">原頁面</span> &rarr;
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            updateLabels();
        }

        // 搜尋與篩選邏輯
        function filterNovels() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filter = document.getElementById('filter-select').value;

            const filtered = novels.filter(n => {
                const matchesSearch = n.title.toLowerCase().includes(query) || n.category.toLowerCase().includes(query);
                const matchesFilter = filter === 'all' || n.status === filter;
                return matchesSearch && matchesFilter;
            });

            renderNovels(filtered);
        }

        // 預覽與閱讀器 Modal 操作
        function openPreview(id) {
            const data = novels.find(n => n.id === id);
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-body').innerText = data.content;
            document.getElementById('btn-modal-go').href = data.url;
            document.getElementById('btn-modal-inline').onclick = function() {
                closePreview();
                openReader(id);
            };
            document.getElementById('preview-modal').classList.remove('hidden');
        }

        function closePreview() {
            document.getElementById('preview-modal').classList.add('hidden');
        }

        function openReader(id) {
            const data = novels.find(n => n.id === id);
            document.getElementById('reader-title').innerText = data.title;
            document.getElementById('reader-frame').src = data.url;
            document.getElementById('reader-external-btn').href = data.url;
            document.getElementById('reader-modal').classList.remove('hidden');
        }

        function closeReader() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.getElementById('reader-frame').src = "";
        }

        // 暗黑/明亮主題切換
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-sun";
                text.innerText = "Light";
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-moon";
                text.innerText = "Dark";
            }
        }

        // 多語系支援
        const translations = {
            ja: {
                bioPenname: "ペンネーム：狸柚 (Riyu)",
                bioDesc: "青春の光と影、日常の中の小さな奇跡をテーマに、小説を執筆中。<br>願わくは、一言でも誰かの心に届きますように。",
                following: "フォロー中",
                followers: "フォロワー",
                btnFollow: "フォロー",
                sectionNovel: "作品一覧",
                btnPrev: "あらすじ預覽",
                btnInline: "站內閱讀",
                btnRead: "原頁面",
                sectionX: "X 最新ポスト",
                modalClose: "閉じる"
            },
            zh: {
                bioPenname: "筆名：狸柚 (Riyu)",
                bioDesc: "以青春的光與影、日常中的小小奇蹟為主題，撰寫小說。<br>願有一字能觸及某人的心。",
                following: "追蹤中",
                followers: "追蹤者",
                btnFollow: "追蹤",
                sectionNovel: "作品列表",
                btnPrev: "故事簡介",
                btnInline: "站內閱讀",
                btnRead: "原頁面",
                sectionX: "X 最新動態",
                modalClose: "關閉"
            },
            en: {
                bioPenname: "Pen Name: Riyu (狸柚)",
                bioDesc: "Writing web novels focused on youth's light & shadow, and small everyday miracles.<br>May a single word reach someone's heart.",
                following: "Following",
                followers: "Followers",
                btnFollow: "Follow",
                sectionNovel: "Novels",
                btnPrev: "Synopsis",
                btnInline: "Read Here",
                btnRead: "Source Page",
                sectionX: "Latest X Posts",
                modalClose: "Close"
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('bio-penname').innerText = t.bioPenname;
            document.getElementById('bio-desc').innerHTML = t.bioDesc;
            document.getElementById('label-following').innerText = t.following;
            document.getElementById('label-followers').innerText = t.followers;
            document.getElementById('btn-follow').innerText = t.btnFollow;
            document.getElementById('section-novel-title').innerText = t.sectionNovel;
            document.getElementById('section-x-title').innerText = t.sectionX;
            document.getElementById('btn-modal-close').innerText = t.modalClose;

            ['ja', 'zh', 'en'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                btn.className = l === lang ? "px-3 py-1.5 rounded-lg bg-sky-500 text-white shadow-sm transition" : "px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition";
            });

            updateLabels();
        }

        function updateLabels() {
            const t = translations[currentLang];
            document.querySelectorAll('.btn-prev-text').forEach(el => el.innerText = t.btnPrev);
            document.querySelectorAll('.btn-inline-text').forEach(el => el.innerText = t.btnInline);
            document.querySelectorAll('.btn-read-text').forEach(el => el.innerText = t.btnRead);
        }

        // 初始化
        renderNovels(novels);

        // 動態加載 X Widget 腳本
        (function loadTwitter() {
            const script = document.createElement('script');
            script.src = "https://platform.twitter.com/widgets.js";
            script.charset = "utf-8";
            script.async = true;
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
